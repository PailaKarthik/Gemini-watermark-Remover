{% extends "base.html" %}

{% block content %}
<div class="page" style="text-align:center">
  <p class="crumb"><a href="{{ lang_prefix }}/">{{ t.nav.home }}</a> / 404</p>
  <h1 style="font-size:64px">{{ t.e404.h1a }}<span>{{ t.e404.h1b }}</span>{{ t.e404.h1c }}</h1>
  <p class="lead">{{ t.e404.lead }}</p>
  <div class="btnrow" style="justify-content:center">
    <a class="btn primary" href="{{ lang_prefix }}/remover">{{ t.e404.cta }}</a>
    <a class="btn ghost" href="{{ lang_prefix }}/guides">{{ t.e404.cta2 }}</a>
  </div>
</div>
{% endblock %}
